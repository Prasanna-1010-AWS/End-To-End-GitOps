replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/go-web-app
  pullPolicy: IfNotPresent
  tag: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: staging.prasanna-aws.com
      paths:
        - path: /
          pathType: Prefix

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
