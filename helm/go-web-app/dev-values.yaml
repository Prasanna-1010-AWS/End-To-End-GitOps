replicaCount: 1

global:
  awsAccountId: "837717008195"
  region: ap-south-1

image:
  name: go-web-app
  tag: "613160b"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  hosts:
    - host: dev.prasanna-aws.com
      paths:
        - path: /
          pathType: Prefix
