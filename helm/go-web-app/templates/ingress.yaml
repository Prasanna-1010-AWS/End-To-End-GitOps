apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-web-app
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/target-type: instance   # <--- IMPORTANT
spec:
  rules:
    - host: dev.prasanna-aws.cloud
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: go-web-app
                port:
                  number: 80
